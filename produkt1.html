<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Custom Gaming PC från Modhouse.">
    <title>Custom Gaming PC - Modhouse</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MGQQR5PHLD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-MGQQR5PHLD');
    </script>
</head>

<body>

    <header>
        <h1>Modhouse</h1>

        <nav aria-label="Huvudnavigation">
            <ul>
                <li>
                    <a href="index.html">Hem</a>
                </li>
                <li>
                    <a href="produkter.html">Produkter</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <article
            itemscope
            itemtype="https://schema.org/Product"
        >

            <h2 itemprop="name">Custom Gaming PC</h2>

            <img
                src="images/pc-cyberdrive.jpeg"
                alt="Custom Gaming PC"
                width="500"
                itemprop="image"
            >

            <p itemprop="description">
                En custombyggd gaming-PC för hög prestanda
                och gaming.
            </p>

            <section>
                <h3>Specifikationer</h3>

                <ul>
                    <li>Processor: Ryzen 7 7800X3D</li>
                    <li>Grafikkort: RTX 4080</li>
                    <li>RAM: 32 GB DDR5</li>
                    <li>Lagring: 2 TB NVMe SSD</li>
                </ul>
            </section>

            <p>
                Pris:
                <span
                    itemprop="offers"
                    itemscope
                    itemtype="https://schema.org/Offer"
                >
                    <span itemprop="price">28999</span>
                    <span itemprop="priceCurrency">SEK</span>
                </span>
            </p>

            <p>
                <a href="produkter.html">
                    Tillbaka till produkter
                </a>
            </p>

        </article>

    </main>

    <footer>
        <p>&copy; 2026 Modhouse</p>
    </footer>
