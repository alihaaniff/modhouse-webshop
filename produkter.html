<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Se Modhouse produkter inom custom gaming.">
    <title>Produkter - Modhouse</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MGQQR5PHLD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-MGQQR5PHLD');
    </script>
</head>

<body>

    <header>
        <h1>Modhouse</h1>

        <nav aria-label="Huvudnavigation">
            <ul>
                <li>
                    <a href="index.html">Hem</a>
                </li>
                <li>
                    <a href="produkter.html">Produkter</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Produkter</h2>

            <article
                itemscope
                itemtype="https://schema.org/Product"
            >

                <h3 itemprop="name">Custom Gaming PC</h3>

                <img
                    src="images/pc-cyberdrive.jpeg"
                    alt="Custom Gaming PC"
                    width="300"
                    itemprop="image"
                >

                <p itemprop="description">
                    En custombyggd gaming-PC för hög prestanda
                    och gaming.
                </p>

                <p>
                    Pris:
                    <span
                        itemprop="offers"
                        itemscope
                        itemtype="https://schema.org/Offer"
                    >
                        <span itemprop="price">28999</span>
                        <span itemprop="priceCurrency">SEK</span>
                    </span>
                </p>

                <a href="produkt1.html">
                    Visa produkt
                </a>

            </article>

            <article
                itemscope
                itemtype="https://schema.org/Product"
            >

                <h3 itemprop="name">Uplink Gaming Mouse</h3>

                <img
                    src="images/mouse-uplink.webp"
                    alt="Uplink Gaming Mouse"
                    width="300"
                    itemprop="image"
                >

                <p itemprop="description">
                    En enkel och anpassningsbar gamingmus
                    för gaming.
                </p>

                <p>
                    Pris:
                    <span
                        itemprop="offers"
                        itemscope
                        itemtype="https://schema.org/Offer"
                    >
                        <span itemprop="price">799</span>
                        <span itemprop="priceCurrency">SEK</span>
                    </span>
                </p>

                <a href="produkt2.html">
                    Visa produkt
                </a>

            </article>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Modhouse</p>
    </footer>

</body>

</html>
