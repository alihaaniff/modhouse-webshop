<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout – Modhouse</title>

    <meta name="description"
        content="Slutför din beställning hos Modhouse.">

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MGQQR5PHLD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-MGQQR5PHLD');
    </script>
</head>

<body data-page="checkout">

    <!-- Header -->
    <header class="site-header">

        <div class="container header-inner">

            <a class="logo" href="index.html">
                MOD<span>HOUSE</span>
            </a>

            <nav aria-label="Huvudnavigation">

                <ul class="nav-list">
                    <li><a href="index.html">Hem</a></li>
                    <li><a href="produkter.html">Produkter</a></li>
                    <li><a href="index.html#categories">Kategorier</a></li>
                    <li><a href="index.html#about">Om oss</a></li>
                </ul>

            </nav>

            <a class="cart-link" href="kundvagn.html">
                🛒 Kundvagn
                <span class="cart-count">0</span>
            </a>

        </div>

    </header>

    <main>

        <!-- Checkout -->
        <section class="section">

            <div class="container">

                <h1>
                    Slutför beställning
                </h1>

                <div id="checkout-summary" class="notice"></div>

                <form id="checkout-form" class="form">

                    <label for="name">
                        Namn
                    </label>

                    <input
                        id="name"
                        name="name"
                        required
                    >

                    <label for="email">
                        E-post
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        required
                    >

                    <label for="address">
                        Adress
                    </label>

                    <input
                        id="address"
                        name="address"
                        required
                    >

                    <button class="button" type="submit">
                        Slutför betalning
                    </button>

                </form>

                <div id="checkout-result"></div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Modhouse • Skolprojekt
            </p>

            <p>
                Webbshop för retro, custom gaming och limited drops.
            </p>

        </div>

    </footer>

    <script src="js/main.js"></script>

</body>

</html>
